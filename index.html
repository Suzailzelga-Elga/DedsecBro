<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to the Button Zone</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      max-width: 400px;
      width: 90%;
    }

    h1 {
      color: #333;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: #666;
      font-size: 1.1rem;
    }

    button {
      background-color: #ff6b6b;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
      margin-top: 1rem;
    }

    button:hover {
      background-color: #ee5253;
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }

    .counter {
      margin-top: 1.5rem;
      font-size: 1.4rem;
      font-weight: bold;
      color: #222;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>The Pointless Button</h1>
    <p>Press the button to increase your productivity level by 0%.</p>
    
    <button onclick="pressButton()">Click Me!</button>

    <div class="counter">
      Clicks: <span id="clickCount">0</span>
    </div>
  </div>

  <script>
    let count = 0;
    const messages = [
      "Press the button to increase your productivity level by 0%.",
      "Great job! That click accomplished nothing.",
      "Still clicking? Incredible dedication.",
      "Legend says if you reach 100, a unicorn appears.",
      "Okay, maybe no unicorn, but keep going anyway!",
      "You are officially a button-pressing master."
    ];

    function pressButton() {
      count++;
      document.getElementById('clickCount').innerText = count;
      
      // Change message dynamically every few clicks
      const messageIndex = Math.min(Math.floor(count / 5), messages.length - 1);
      document.querySelector('p').innerText = messages[messageIndex];
    }
  </script>

</body>
</html>
